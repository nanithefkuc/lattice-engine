[package]
name = "lattice-engine"
version = "0.0.0"
edition = "2024"
rust-version = "1.89"
license = "MIT"
publish = false
description = "Closest-vector, sphere, and maximum-likelihood lattice decoding."
repository = "https://github.com/nanithefkuc/lattice-engine"
readme = "README.md"
exclude = ["/.github", "/.plans"]

[features]
default = ["simd"]
# The engine-owned decode-batch kernel over this crate's flat layout, plus
# forwarded dispatched real-vector transforms in `lattica`. Selection stays
# single-source through simdispatch.
simd = ["lattica/simd", "dep:archmage", "dep:simdispatch"]
# Unstable implementation APIs, exempt from compatibility guarantees.
internals = []

[dependencies]
lattica = { git = "https://github.com/nanithefkuc/lattica", rev = "6178a525a34956af8d6c6eff54347bc76d23936e", default-features = false }
# Same revisions `lattica` pins, so Cargo resolves one copy of each.
archmage = { git = "https://github.com/nanithefkuc/archmage", rev = "de519319b5670d93f71dada4c49cdfd83c0fc0ec", optional = true }
simdispatch = { git = "https://github.com/nanithefkuc/simdispatch", rev = "5940194107384953cd8cd9f45c8d902b26d5686e", optional = true }

[dev-dependencies]
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "fplll_compare"
harness = false

[[bench]]
name = "optimization"
harness = false
required-features = ["internals"]

[lints.rust]
missing_docs = "deny"
# `forbid` lives in src/lib.rs so that integration tests may install a
# counting global allocator, which requires `unsafe impl GlobalAlloc`.
unsafe_code = "deny"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
as_conversions = "warn"
cast_possible_truncation = "warn"
float_cmp = "warn"
